name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        # Hum seedha gradle use karenge gradlew ki bajaye
        run: |
          if [ -d "AttendBot" ]; then
            cd AttendBot
            gradle assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendBot-APK
          path: "**/app-debug.apk"
