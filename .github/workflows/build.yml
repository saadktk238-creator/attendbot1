name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build APK
        run: |
          # 1. Agar files AttendBot folder ke andar hain to wahan jaye
          if [ -f "AttendBot/build.gradle" ]; then
            cd AttendBot
          fi
          
          # 2. Build shuru karein
          gradle :app:assembleDebug --stacktrace

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendBot-APK
          path: "**/app-debug.apk"
